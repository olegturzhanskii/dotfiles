[skin]
    description = Gruvbox Dark, taken from the terminal palette

# NOTE:
# Mine, rather than a copy of an existing gruvbox skin.
#
# The section and key names are Midnight Commander's own skin format, and the frame characters below are the values
# every shipped skin uses, because there is one sensible value for each.
#
# The colors are the part that is a choice, and almost every one of them is a terminal color name rather than a hex
# value.
#
# Alacritty already maps the sixteen ANSI colors to gruvbox, so `white` is #ebdbb2, `brightblue` is #83a598, and so
# on.
#
# That keeps this file from becoming a seventh copy of the palette, and it follows any future theme change
# automatically.
#
# The two exceptions are color237 and color239, the gruvbox greys #3c3836 and #504945, which the sixteen-color palette
# does not contain and which tmux.conf already names by number.
#
# An empty background means the terminal's own, so the panels keep Alacritty's opacity and blur.

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = white;
    selected = white;color239
    marked = yellow;
    markselect = yellow;color239
    gauge = black;brightgreen
    input = white;color237
    inputunchanged = gray;color237
    inputmark = black;yellow
    disabled = gray;
    reverse = black;lightgray
    commandlinemark = black;yellow
    header = brightblue;
    inputhistory =
    commandhistory =
    shadow = black;

[dialog]
    _default_ = white;color237
    dfocus = black;yellow
    dhotnormal = brightred;color237
    dhotfocus = black;yellow
    dtitle = brightblue;color237

[error]
    _default_ = white;red
    errdfocus = black;yellow
    errdhotnormal = yellow;red
    errdhotfocus = black;yellow
    errdtitle = white;red

[filehighlight]
    directory = brightblue;
    executable = brightgreen;
    symlink = brightcyan;
    hardlink =
    stalelink = brightred;
    device = brightred;
    special = gray;
    core = red;
    temp = gray;
    archive = brightmagenta;
    doc = white;
    source = yellow;
    media = green;
    graph = cyan;
    database = brown;

[menu]
    _default_ = white;color237
    menusel = black;yellow
    menuhot = brightred;color237
    menuhotsel = black;yellow
    menuinactive = gray;color237

[popupmenu]
    _default_ = white;color237
    menusel = black;yellow
    menutitle = brightblue;color237

[buttonbar]
    hotkey = black;brightblue
    button = white;color237

[statusbar]
    _default_ = white;color237

[help]
    _default_ = white;color237
    helpitalic = brightcyan;color237
    helpbold = yellow;color237
    helplink = brightblue;color237
    helpslink = black;yellow
    helptitle = brightblue;color237

[editor]
    _default_ = white;
    editbold = yellow;
    editmarked = black;color239
    editwhitespace = gray;
    editnonprintable = ;black
    editlinestate = gray;color237
    bookmark = black;yellow
    bookmarkfound = black;brightgreen
    editrightmargin = gray;
    editframe = gray;
    editframeactive = brightblue;
    editframedrag = yellow;

[viewer]
    _default_ = white;
    viewbold = yellow;
    viewunderline = brightcyan;
    viewselected = black;yellow

[diffviewer]
    added = black;brightgreen
    changedline = white;color239
    changednew = black;brightgreen
    changed = black;yellow
    removed = black;brightred
    error = white;red

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = «
    history-next-item-char = »
    history-show-list-char = ^
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
