set-option -gs escape-time 0

set-option -gs focus-events on

set-option -gs set-clipboard on

set-option -as terminal-features ",alacritty*:clipboard:cstyle:focus:hyperlinks:title:RGB:usstyle"

set-option -gs default-terminal "tmux-256color"


set-option -g base-index 1

set-option -g detach-on-destroy off

set-option -g history-limit 10000

set-option -g mouse on

set-option -g renumber-windows on

set-option -g set-titles on 


set-window-option -g clock-mode-style 12

set-window-option -g mode-keys vi

set-window-option -g pane-base-index 1

set-window-option -g pane-border-indicators arrows

set-window-option -g pane-border-lines heavy

set-window-option -g popup-border-lines rounded


set-option -g scroll-on-clear on


bind-key r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf"


set-option -g @plugin "egel/tmux-gruvbox"

set-option -g @plugin "tmux-plugins/tmux-continuum"

set-option -g @plugin "tmux-plugins/tmux-resurrect"


set-option -g @tmux-gruvbox-right-status-x "%a %b %-d"

set-option -g @tmux-gruvbox-right-status-y "%-I:%M %p"


set-option -g @continuum-restore "on"


# NOTE:
# What comes back after a restart, and what does not.
#
# resurrect already relaunches nvim, htop, less and man from its own default list; mc is the one this environment uses
# that is missing from it.
#
# Restoring a program is not resuming it: the layout, the working directories and the command come back, and whatever
# the program was in the middle of does not.
#
# Pane contents are worth the larger save files, because the useful thing after a reboot is usually what a command
# printed before it.
set-option -g @resurrect-processes "mc"

set-option -g @resurrect-capture-pane-contents "on"


if-shell "[ -x $HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm ]" {
	run-shell "$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm"
}

